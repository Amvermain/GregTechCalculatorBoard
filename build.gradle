plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${minecraft_version}-${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            systemProperty 'neoforge.logging.console.level', 'debug'
            jvmArgument '-Djava.net.preferIPv4Stack=true'
        }

        server {
            server()
            systemProperty 'neoforge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            systemProperty 'neoforge.logging.console.level', 'debug'
            jvmArgument '-Djava.net.preferIPv4Stack=true'
            programArgument 'nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = 'Create / Registrate'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'devOS'
        url = 'https://mvn.devos.one/snapshots/'
    }
    maven {
        name = 'Configuration Repsy'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'Toma Configuration'
        url = 'https://maven.toma.dev/'
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
    }
    maven {
        name = 'FirstDarkDev Maven'
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    flatDir {
        def localMods = localProperties.getProperty('target.mods.dir')
        def dirsList = ['libs', 'instance/mods']
        if (localMods) {
            dirsList.add(localMods)
        }
        dirs dirsList.toArray()
    }
}

dependencies {
    // EMI API & Runtime
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    testImplementation "dev.emi:emi-neoforge:${emi_version}"
    if (project.findProperty('recipe_viewer') != 'jei') {
        runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    }

    // JEI API & Runtime
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    testImplementation "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // GregTech Modern & LowDragLib
    compileOnly("com.gregtechceu.gtceu:gtceu-1.21.1:${gtceu_version}") {
        exclude group: 'dev.toma.configuration'
    }
    testImplementation("com.gregtechceu.gtceu:gtceu-1.21.1:${gtceu_version}") {
        exclude group: 'dev.toma.configuration'
    }
    runtimeOnly("com.gregtechceu.gtceu:gtceu-1.21.1:${gtceu_version}") {
        exclude group: 'dev.toma.configuration'
    }
    runtimeOnly "com.lowdragmc.ldlib:ldlib-neoforge-1.21.1:${ldlib_version}"

    // Testing framework
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        curseforge_project_id: curseforge_project_id
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

tasks.register('deployToInstance', Copy) {
    group = 'deployment'
    description = 'Builds jar and copies it into local test instance mods directory.'
    dependsOn 'jar'

    def targetDirStr = localProperties.getProperty('target.mods.dir') ?: System.getenv('MC_TEST_MODS_DIR')
    if (targetDirStr) {
        def targetDir = file(targetDirStr)
        from tasks.named('jar')
        into targetDir

        doFirst {
            if (!targetDir.exists()) {
                targetDir.mkdirs()
            }
            fileTree(dir: targetDir, include: "${mod_id}-*.jar").each { oldJar ->
                delete oldJar
                println "🗑 Removed previous jar: ${oldJar.name}"
            }
        }

        doLast {
            println "✔ Successfully deployed ${tasks.named('jar').get().archiveFileName.get()} -> ${targetDir}"
        }
    } else {
        doLast {
            println "⚠ 'target.mods.dir' is not set in local.properties. Skipping instance deployment."
        }
    }
}

tasks.register('cleanDeploy') {
    group = 'deployment'
    description = 'Cleans, builds, tests, and deploys jar to local test instance.'
    dependsOn 'clean', 'deployToInstance'
}
tasks.named('deployToInstance').configure { mustRunAfter 'clean' }
