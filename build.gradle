plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${minecraft_version}-${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "${mapping_channel}", version: "${mapping_version}"
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap remapping in dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Dev memory allocation
            jvmArgs '-XX:+AllowEnhancedClassRedefinition'
            jvmArgs '-Xmx4G', '-Xms2G'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args 'nogui'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'FirstDarkDev Maven'
        url = 'https://maven.firstdarkdev.xyz/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = 'Architectury / Rhino'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Latvian / KubeJS'
        url = 'https://maven.latvian.dev/react/'
    }
    maven {
        name = 'Toma Configuration'
        url = 'https://maven.toma.dev/'
    }
    flatDir {
        def localMods = localProperties.getProperty('target.mods.dir')
        def dirsList = ['libs', 'instance/mods', "${System.getProperty('user.home')}/AppData/Roaming/PrismLauncher/instances/Star Technology/minecraft/mods"]
        if (localMods) {
            dirsList.add(localMods)
        }
        dirs dirsList.toArray()
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // EMI API & Runtime (Deobfuscated automatically by ForgeGradle)
    compileOnly fg.deobf("curse.maven:emi-580555:${emi_file_id}")
    runtimeOnly fg.deobf("curse.maven:emi-580555:${emi_file_id}")

    // JEI API & Runtime (Required for Thermal Series native JEI plugin -> EMI bridge)
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("local:jei-${minecraft_version}-forge-${jei_runtime_version}:${jei_runtime_version}")

    // Jade (WAILA / Block Tooltip HUD mod for runClient testing)
    runtimeOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")

    // GregTech Modern & LowDragLib (Switchable: 'official' or 'start_fork')
    def gtceuVariant = project.findProperty('gtceu_variant') ?: 'official'
    if (gtceuVariant == 'start_fork') {
        compileOnly fg.deobf("local:gtceu-st-${minecraft_version}-${gtceu_st_version}:${gtceu_st_version}")
        runtimeOnly fg.deobf("local:gtceu-st-${minecraft_version}-${gtceu_st_version}:${gtceu_st_version}")
        runtimeOnly fg.deobf("local:ldlib-forge-${minecraft_version}-${ldlib_version}:${ldlib_version}")
    } else {
        compileOnly fg.deobf("curse.maven:gregtechceu-modern-890405:${gtceu_curseforge_file_id}")
        runtimeOnly fg.deobf("curse.maven:gregtechceu-modern-890405:${gtceu_curseforge_file_id}")
        runtimeOnly fg.deobf("curse.maven:ldlib-626676:${ldlib_curseforge_file_id}")
    }

    // Thermal Series (CoFH Core, Thermal Foundation, Thermal Expansion, Thermal Cultivation)
    compileOnly fg.deobf("local:cofh_core-${minecraft_version}-${cofh_core_version}:${cofh_core_version}")
    runtimeOnly fg.deobf("local:cofh_core-${minecraft_version}-${cofh_core_version}:${cofh_core_version}")
    compileOnly fg.deobf("local:thermal_foundation-${minecraft_version}-${thermal_foundation_version}:${thermal_foundation_version}")
    runtimeOnly fg.deobf("local:thermal_foundation-${minecraft_version}-${thermal_foundation_version}:${thermal_foundation_version}")
    compileOnly fg.deobf("local:thermal_expansion-${minecraft_version}-${thermal_expansion_version}:${thermal_expansion_version}")
    runtimeOnly fg.deobf("local:thermal_expansion-${minecraft_version}-${thermal_expansion_version}:${thermal_expansion_version}")
    compileOnly fg.deobf("local:thermal_cultivation-${minecraft_version}-${thermal_cultivation_version}:${thermal_cultivation_version}")
    runtimeOnly fg.deobf("local:thermal_cultivation-${minecraft_version}-${thermal_cultivation_version}:${thermal_cultivation_version}")

    // Create (필요 시 주석 해제)
    // runtimeOnly fg.deobf(name: "create-${minecraft_version}-${create_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        curseforge_project_id: curseforge_project_id
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('deployToInstance', Copy) {
    group = 'deployment'
    description = 'Builds reobfuscated jar and copies it into local test instance mods directory.'
    dependsOn 'reobfJar'

    def targetDirStr = localProperties.getProperty('target.mods.dir') ?: System.getenv('MC_TEST_MODS_DIR')
    if (targetDirStr) {
        def targetDir = file(targetDirStr)
        from tasks.named('jar')
        into targetDir

        doFirst {
            if (!targetDir.exists()) {
                targetDir.mkdirs()
            }
            fileTree(dir: targetDir, include: "${mod_id}-*.jar").each { oldJar ->
                delete oldJar
                println "🗑 Removed previous jar: ${oldJar.name}"
            }
        }

        doLast {
            println "✔ Successfully deployed ${tasks.named('jar').get().archiveFileName.get()} -> ${targetDir}"
        }
    } else {
        doLast {
            println "⚠ 'target.mods.dir' is not set in local.properties. Skipping instance deployment."
        }
    }
}

tasks.register('cleanDeploy') {
    group = 'deployment'
    description = 'Cleans, builds, tests, and deploys jar to local test instance.'
    dependsOn 'clean', 'deployToInstance'
}
tasks.named('deployToInstance').configure { mustRunAfter 'clean' }
